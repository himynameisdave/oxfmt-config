name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint (builds first — self-lints with @himynameisdave/oxlint-config, type-aware on)
        run: bun run lint

      - name: Format check (builds first — self-formats with own config)
        run: bun run format:check

      - name: Option coverage (every oxfmt option has a decision)
        run: bun run check-coverage

      - name: Consumer smoke test (packs, installs, formats as a consumer would)
        run: bun run test:consumer
